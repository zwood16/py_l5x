[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py_l5x"
version = "0.5.0"
description = "Parse Rockwell Automation L5X project files into a hierarchical Python object model."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
include = ["py_l5x*"]

[tool.setuptools.package-data]
py_l5x = ["data/*.gz"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# The rule categories to enable.
select = [
    "E",   # pycodestyle (catches formatting-adjacent errors)
    "F",   # Pyflakes (catches logical errors, like unused variables)
    "I",   # isort (automatically sorts your imports)
    "UP",  # pyupgrade (suggests modern syntax upgrades)
    "B",   # flake8-bugbear (catches common bugs and gotchas)
    "SIM", # flake8-simplify (suggests cleaner, more elegant code)
]

[tool.ruff.lint.per-file-ignores]
# SDK harness: experiment scripts with long XML one-liners; rt_writer.load is
# re-exported for gen.py.
"tools/**" = ["E501", "E731", "E741", "F401", "F841"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.5",
]
